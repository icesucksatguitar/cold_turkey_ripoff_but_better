appId: com.focusguard.app
productName: FocusGuard
directories:
  output: release
  buildResources: build
files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FocusGuard
